[project]
name = "text-db-llm"
version = "0.1.0"
description = "Text database with search using LlamaIndex and Chroma"
requires-python = ">=3.12"
dependencies = [
    "llama-index-core>=0.14,<0.15",
    "llama-index-llms-ollama>=0.10,<1",
    "llama-index-embeddings-huggingface>=0.7,<1",
    "llama-index-vector-stores-chroma>=0.3,<1",
    "chromadb>=0.5,<2",
]

[tool.uv]
package = false
