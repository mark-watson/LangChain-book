[project]
name = "hugging-face"
version = "0.1.0"
description = "Local HuggingFace transformers with LlamaIndex 0.14"
requires-python = ">=3.12"
dependencies = [
    "llama-index-core>=0.14,<0.15",
    "llama-index-embeddings-huggingface>=0.7,<1",
    "llama-index-llms-ollama>=0.10,<1",
    "langchain-huggingface>=1.0,<2",
    "transformers>=4.40,<5",
    "torch>=2.0,<3",
]

[tool.uv]
package = false
